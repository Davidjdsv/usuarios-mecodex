<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title>RBCA</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar color="primary">
      <ion-title size="large">RBCA</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-card class="ion-margin-top">
    <ion-card-content class="ion-padding">
      <div class="ion-padding">
        <ion-button
          color="primary"
          class="ion-margin"
          (click)="crearRolModal()"
        >
          <ion-icon name="person-add" slot="end" color="tertiary"></ion-icon>
          Crear rol
        </ion-button>

        @for (rol of roles(); track rol.id_rol; let i = $index){
        <ion-card class="ion-margin-top card-hover user-card ion-no-padding">
          <ion-card-content class="ion-no-padding">
            <ion-grid [fixed]="true">
              <ion-row class="ion-justify-content-between">
                <!-- Col 1: Imagen -->
                <ion-col
                  size="12"
                  size-md="4"
                  class="ion-text-center img-ion-col ion-align-items-center"
                >
                  <ion-thumbnail class="thumb-cover">
                    <!-- Icono genérico para roles -->
                    <img
                      src="assets/icon/roles-group-solid.svg"
                      alt="icono de roles"
                    />
                  </ion-thumbnail>
                </ion-col>

                <!-- Col 2: Nombre / Descripción -->
                <ion-col size="12" size-md="4" class="meta">
                  <ion-item lines="none" aria-label="rol name">
                    <ion-icon
                      slot="start"
                      color="primary-dark"
                      name="key-outline"
                      aria-hidden="true"
                    ></ion-icon>
                    <ion-label>
                      <ion-text>
                        <strong>Rol:</strong> {{ rol.nombre_rol | titlecase }}
                      </ion-text>
                    </ion-label>
                  </ion-item>

                  <ion-item lines="none" aria-label="rol description">
                    <ion-icon
                      slot="start"
                      color="primary-dark"
                      name="information-circle-outline"
                      aria-hidden="true"
                      max="150"
                      maxlength="150"
                    ></ion-icon>
                    <ion-label class="ion-text-wrap">
                      <ion-text>
                        <strong>Descripción:</strong> {{ rol.descripcion || 'Sin descripción' }}
                      </ion-text>
                    </ion-label>
                  </ion-item>
                </ion-col>

                <!-- Col 3: Estado -->
                <ion-col size="12" size-md="4" class="meta">
                  <ion-item lines="none" aria-label="rol status">
                    <ion-icon
                      slot="start"
                      [color]="rol.activo === 1 ? 'success' : 'medium'"
                      name="radio-button-on-outline"
                      aria-hidden="true"
                    ></ion-icon>
                    <ion-label>
                      <ion-text>
                        <strong>Estado:</strong> {{ rol.activo === 1 ? 'Activo'
                        : 'Inactivo' }}
                      </ion-text>
                    </ion-label>
                  </ion-item>
                </ion-col>
              </ion-row>
            </ion-grid>

            <ion-grid [fixed]="true">
              <ion-row class="ion-justify-content-evenly">
                <ion-col size="12" size-md="4">
                  <ion-buttons
                    class="ion-justify-content-center ion-margin-horizontal"
                  >
                    <ion-button
                      (click)="editRolmodal(rol)"
                      color="primary-dark"
                      class="ion-margin-end"
                    >
                      <ion-icon name="create-outline" slot="start"></ion-icon>
                      Editar
                    </ion-button>

                    @if (rol.id_rol > 2) {
                    <ion-button color="danger" class="ion-margin-end">
                      <ion-icon
                        name="trash-outline"
                        slot="start"
                        class="delete-icon"
                        color="danger"
                      ></ion-icon>
                      Eliminar
                    </ion-button>
                    }
                  </ion-buttons>
                </ion-col>
              </ion-row>
            </ion-grid>
          </ion-card-content>
        </ion-card>
        }
        <!-- Aquí iría el contenido de roles -->
      </div>
    </ion-card-content>
  </ion-card>
</ion-content>
