<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title>Inicio</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar color="primary">
      <ion-title size="large">Inicio</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-text class="ion-padding-top align-items-center">
    <h1 class="ion-padding-horizontal">Dashboard ActivaMecodex</h1>
  </ion-text>

  <ion-grid>
    <ion-row>
      <!-- Mostrar el total de clientes de Mecodex -->
      <ion-col size="12" size-md="6">
        <ion-card>
          <ion-card-header>
            <ion-card-title class="ion-text-center">Total de clientes</ion-card-title>
          </ion-card-header>
          <ion-card-content>
            <app-client-chart> </app-client-chart>
          </ion-card-content>
        </ion-card>
      </ion-col>

      <!-- Mostrar el total de clientes de Mecodex por país -->
      <ion-col size="12" size-md="6">
        <ion-card>
          <ion-card-header>
            <ion-card-title class="ion-text-center">Clientes por país</ion-card-title>
          </ion-card-header>
          <ion-card-content>
            <app-pais-chart> </app-pais-chart>
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>

    <ion-row>
      <!-- Mostrar el total de planes adquiridos por Mecodex -->
      <ion-col size="12" size-md="6">
        <ion-card>
          <ion-card-header>
            <ion-card-title class="ion-text-center">Total planes adquiridos</ion-card-title>
          </ion-card-header>
          <ion-card-content>
            <app-planes-chart> </app-planes-chart>
          </ion-card-content>
        </ion-card>
      </ion-col>

      <!-- Mostrar el total de clientes de Mecodex -->
      <ion-col size="12" size-md="6">
        <ion-card>
          <ion-card-header>
            <ion-card-title class="ion-text-center">Clientes de Mecodex por mes</ion-card-title>
          </ion-card-header>
          <ion-card-content>
            <app-evolucion-clientes-chart> </app-evolucion-clientes-chart>
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
