<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title tabindex="-1">Más información</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large" tabindex="-1">Más información</ion-title>
    </ion-toolbar>
  </ion-header>

    <ion-button class="ion-margin" [routerLink]="['/usuarios-web-closter']" color="primary">
    <ion-icon name="arrow-back" slot="start"></ion-icon>
    Volver
  </ion-button>

<ion-card class="ion-margin-top card-hover user-card ion-no-padding">
  <ion-card-content class="ion-no-padding">
    <ion-grid [fixed]="true">
      <ion-row class="ion-justify-content-between">
        <!-- Col 1: Imagen -->
        <ion-col
          size="12"
          size-md="4"
          class="ion-text-center img-ion-col ion-align-items-center"
        >
          <ion-thumbnail class="thumb-cover">
            <img
              alt="A silloute of a user"
              src="../../../assets/icon/user-group-solid.svg"
            />
          </ion-thumbnail>
        </ion-col>

        <!-- Col 2: Nombre / Contacto / Email -->
        <ion-col size="12" size-md="4" class="meta">
          <ion-item lines="none" aria-label="favorite">
            <ion-icon
              slot="start"
              color="primary"
              name="person-outline"
              aria-hidden="true"
            ></ion-icon>
            <ion-label>
              <ion-text>
                <strong>Nombre completo:</strong>
              </ion-text>
            </ion-label>
          </ion-item>

          <ion-item lines="none" aria-label="favorite">
            <ion-icon
              slot="start"
              color="primary"
              name="call-outline"
              aria-hidden="true"
            ></ion-icon>
            <ion-label>
              <ion-text>
                <strong>Contacto:</strong>
              </ion-text>
            </ion-label>
          </ion-item>

          <ion-item lines="none" aria-label="favorite">
            <ion-icon
              slot="start"
              color="primary"
              name="mail-outline"
              aria-hidden="true"
            ></ion-icon>
            <ion-label>
              <ion-text class="wrap">
                <strong>Correo:</strong>
              </ion-text>
            </ion-label>
          </ion-item>
        </ion-col>

        <!-- Col 3: Documento / Plan / País -->
        <ion-col size="12" size-md="4" class="meta">
          <ion-item lines="none" aria-label="favorite">
            <ion-icon
              slot="start"
              color="primary"
              name="document-text-outline"
              aria-hidden="true"
            ></ion-icon>
            <ion-label>
              <ion-text>
                <strong>Documento:</strong>
              </ion-text>
            </ion-label>
          </ion-item>

          <ion-item lines="none" aria-label="favorite">
            <ion-icon
              slot="start"
              color="primary"
              name="cloud-outline"
              aria-hidden="true"
            ></ion-icon>
            <ion-label>
              <ion-text>
                <strong>Usuario:</strong>
              </ion-text>
            </ion-label>
          </ion-item>
        </ion-col>
      </ion-row>
    </ion-grid>

  </ion-card-content>
</ion-card>
</ion-content>
