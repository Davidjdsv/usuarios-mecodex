<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title>login</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" scrollY="false">
  <ion-header collapse="condense">
    <ion-toolbar color="primary">
      <ion-title size="large">login</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-grid>
    <ion-row
      class="ion-justify-content-center ion-align-items-center login-center"
    >
      <ion-col size="12" size-md="6">
        <ion-card>
          <ion-card-header color="primary">
            <ion-card-title>login ActivaMecodex</ion-card-title>
          </ion-card-header>
          <ion-card-content>
            <form>
              <ion-row>
                <ion-col class="card-credentials">
                  <ion-input
                    class="ion-margin-vertical"
                    label="Correo o Usuario"
                    label-placement="floating"
                    fill="outline"
                    clearInput="true"
                    type="email"
                    required
                  ></ion-input>
                  <ion-input
                    class="ion-margin-vertical"
                    label="Contraseña"
                    label-placement="floating"
                    fill="outline"
                    type="password"
                    clearInput="true"
                    required
                  ></ion-input>
                  <ion-button type="submit" expand="block">Login</ion-button>
                </ion-col>
                <ion-col size="12" size-md="6">
                  <ion-img src="assets/img/fondo_login.png" alt="fondo_login">
                  </ion-img>
                </ion-col>
              </ion-row>
            </form>
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
