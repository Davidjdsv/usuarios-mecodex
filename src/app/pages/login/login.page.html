<ion-content
  [fullscreen]="true"
  scrollY="false"
  class="ion-display-flex ion-justify-content-center ion-align-items-center"
>
  <!-- Pre loader -->
  @if(loading()){
  <div class="ion-text-center ion-padding">
    <img src="assets/img/preloader_spinner.svg" alt="Cargando..." />
  </div>
  } @else {
  <div class="main-container">
    <ion-card class="card-center box-glass">
      <ion-card-content>
        <ion-grid>
          <ion-row>
            <!-- Formulario - 12 columnas en móvil, 6 en desktop -->
            <ion-col size="12" size-md="6" class="ion-padding">
              <div class="ion-text-center ion-text-md-start">
                <ion-text>
                  <h1 class="titulo-principal">
                    Bienvenido de nuevo a
                    <span color="'primary'">ActivaMecodex</span>
                  </h1>
                </ion-text>
              </div>

              <form class="ion-margin-top">
                <ion-input
                  class="input-field"
                  label="Correo o Usuario"
                  label-placement="floating"
                  fill="outline"
                  clearInput="true"
                  type="text"
                  [(ngModel)]="usuario"
                  name="usuario"
                  required
                >
                  <ion-icon
                    slot="start"
                    color="primary"
                    name="cloud-outline"
                    aria-hidden="true"
                  ></ion-icon>
                </ion-input>

                <ion-input
                  class="input-field"
                  label="Contraseña"
                  label-placement="floating"
                  fill="outline"
                  type="password"
                  clearInput="true"
                  [(ngModel)]="clave"
                  name="clave"
                  required
                >
                  <ion-icon
                    slot="start"
                    color="primary"
                    name="key-outline"
                    aria-hidden="true"
                  ></ion-icon>
                </ion-input>

                <div class="button-container">
                  <ion-button
                    class="btn-login"
                    size="large"
                    type="submit"
                    expand="block"
                    color="primary"
                    (click)="loginUsuario(usuario(), clave())"
                  >
                    Iniciar sesión
                  </ion-button>
                </div>
              </form>
            </ion-col>

            <!-- Imagen - Oculta en móvil, visible en tablet+ -->
            <ion-col
              size="12"
              size-md="6"
              class="ion-display-none ion-display-md-flex ion-align-items-center ion-justify-content-center"
            >
              <img
                class="login-img"
                loading="lazy"
                src="assets/img/login_activa_mecodex.png"
                alt="login_activamecodex"
              />
            </ion-col>
          </ion-row>
        </ion-grid>
      </ion-card-content>
    </ion-card>
  </div>
  }
</ion-content>
