name: Test deployment

on:
  pull_request:
    branches:
      - main
      - dev_jdsv

jobs:
  test-deploy:
    name: Test deployment
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 'Mecodex docs'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: 'Mecodex docs/package-lock.json'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Test build website
        run: npm run build
